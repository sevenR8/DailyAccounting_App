<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f7f8f3" />
    <meta name="description" content="手機優先的每日記帳 PWA" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=46" />
    <title>每日帳本</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="./config.js"></script>
    <script>
      if (window.location.protocol === 'file:') {
        document.querySelector('#app').innerHTML = `
          <main class="auth-card">
            <p class="eyebrow">每日帳本</p>
            <h1>請改用網站網址開啟</h1>
            <p>直接雙擊 index.html 會讓瀏覽器封鎖記帳程式，因此畫面會是空白。請先部署到 Vercel，或以本機網站伺服器開啟這個資料夾。</p>
          </main>`;
      }
    </script>
    <script type="module" src="./app.js?v=46"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        navigator.serviceWorker.register('./service-worker.js?v=46');
      }
    </script>
  </body>
</html>
