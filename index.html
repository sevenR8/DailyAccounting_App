<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f7f8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101812" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="手機優先的每日記帳 PWA" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=141" />
    <style id="startup-theme">
      html, body, #app { min-height: 100%; margin: 0; background: #f7f8f3; color: #172119; }
      @media (prefers-color-scheme: dark) {
        html, body, #app { background: #101812; color: #eff4ed; }
      }
    </style>
    <title>每日帳本</title>
  </head>
  <body>
    <div id="app">
      <main class="ledger-resume" aria-busy="true" aria-label="正在載入帳本">
        <div class="ledger-resume-top"><span class="ledger-resume-avatar" aria-hidden="true"></span></div>
        <section class="ledger-resume-card ledger-resume-summary" aria-hidden="true"></section>
        <section class="ledger-resume-card ledger-resume-primary" aria-hidden="true"></section>
        <section class="ledger-resume-card ledger-resume-secondary" aria-hidden="true"></section>
      </main>
    </div>
    <script src="./config.js?v=1"></script>
    <script>
      if (window.location.protocol === 'file:') {
        document.querySelector('#app').innerHTML = `
          <main class="auth-card">
            <p class="eyebrow">每日帳本</p>
            <h1>請改用網站網址開啟</h1>
            <p>直接雙擊 index.html 會讓瀏覽器封鎖記帳程式，因此畫面會是空白。請先部署到 Vercel，或以本機網站伺服器開啟這個資料夾。</p>
          </main>`;
      }
    </script>
  <script type="module" src="./app.js?v=146"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        // Keep the already visible page intact. The completed update is used
        // on the next launch instead of reloading during a quick entry.
        window.addEventListener('load', () => {
          window.setTimeout(() => {
            navigator.serviceWorker.register('./service-worker.js?v=153', { updateViaCache: 'none' })
              .then((registration) => registration.update())
              .catch(() => {});
          }, 500);
        }, { once: true });
      }
    </script>
  </body>
</html>
