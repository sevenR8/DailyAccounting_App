<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f7f8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101812" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="手機優先的每日記帳 PWA" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=131" />
    <style id="startup-theme">
      html, body, #app { min-height: 100%; margin: 0; background: #f7f8f3; color: #172119; }
      @media (prefers-color-scheme: dark) {
        html, body, #app { background: #101812; color: #eff4ed; }
      }
    </style>
    <title>每日帳本</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="./config.js"></script>
    <script>
      if (window.location.protocol === 'file:') {
        document.querySelector('#app').innerHTML = `
          <main class="auth-card">
            <p class="eyebrow">每日帳本</p>
            <h1>請改用網站網址開啟</h1>
            <p>直接雙擊 index.html 會讓瀏覽器封鎖記帳程式，因此畫面會是空白。請先部署到 Vercel，或以本機網站伺服器開啟這個資料夾。</p>
          </main>`;
      }
    </script>
  <script type="module" src="./app.js?v=138"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        let isReloadingForNewServiceWorker = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (isReloadingForNewServiceWorker) return;
          isReloadingForNewServiceWorker = true;
          window.location.reload();
        });
        navigator.serviceWorker.register('./service-worker.js?v=138', { updateViaCache: 'none' })
          .then((registration) => registration.update());
      }
    </script>
  </body>
</html>
